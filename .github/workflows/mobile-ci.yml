name: Mobile CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Alamat API yang dibakukan ke dalam APK'
        required: false
        default: 'http://10.0.2.2:8000/api'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analisis statis
        run: flutter analyze --no-fatal-infos

      - name: Tes
        run: flutter test

      - name: Build APK release
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'http://10.0.2.2:8000/api' }}

      - name: Unggah APK sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: perpustakaan-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Lampirkan APK ke rilis GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk